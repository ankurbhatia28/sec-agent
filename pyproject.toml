[project]
name = "secrag"
version = "0.1.0"
description = "Retrieval agent over SEC 10-K/10-Q filings, built eval-first"
requires-python = ">=3.12"
dependencies = [
    "diskcache>=5.6.3",
    "langfuse>=4.16.0",
    "litellm>=1.103.2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
secrag = "secrag.cli:main"

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
